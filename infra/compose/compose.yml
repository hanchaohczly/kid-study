services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kid_study
      POSTGRES_USER: kid_study
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kid_study -d kid_study"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: ../..
      target: api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POSTGRES_HOST: postgres
      POSTGRES_DB: kid_study
      POSTGRES_USER: kid_study
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET: ${JWT_SECRET}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY}
      DEV_PARENT_PASSWORD: ${DEV_PARENT_PASSWORD}
      DEV_CHILD_PIN: ${DEV_CHILD_PIN}
      LLM_API_URL: ${LLM_API_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  web:
    build:
      context: ../..
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR:-./data}/prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}

networks:
  backend:
    driver: bridge
